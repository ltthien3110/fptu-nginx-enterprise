load_module /usr/lib/nginx/modules/ngx_http_auth_pam_module.so;
user  root;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # Rate Limiting: Giới hạn 10 request/giây trên mỗi IP để chống DoS
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    # Caching: Khởi tạo vùng nhớ đệm tại /tmp lưu trữ cache
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=my_cache:10m max_size=1g inactive=60m use_temp_path=off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
