version: '3.8'

services:
  nginx:
    build: .
    container_name: fptu-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./sites-available:/etc/nginx/conf.d
      - ./web-content:/usr/share/nginx/html
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - php

  php:
    image: php:8.2-fpm
    container_name: fptu-php
    volumes:
      - ./web-content:/usr/share/nginx/html
  backend1:
    image: nginx:alpine
    container_name: fptu-backend1
    volumes:
      - ./web-content/backend1:/usr/share/nginx/html
    ports:
      - "8081:80"

  backend2:
    image: nginx:alpine
    container_name: fptu-backend2
    volumes:
      - ./web-content/backend2:/usr/share/nginx/html
    ports:
      - "8082:80"
