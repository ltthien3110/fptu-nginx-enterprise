version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: fptu-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./sites-available:/etc/nginx/conf.d
      - ./web-content:/usr/share/nginx/html
    depends_on:
      - php

  php:
    image: php:8.2-fpm
    container_name: fptu-php
    volumes:
      - ./web-content:/usr/share/nginx/html
