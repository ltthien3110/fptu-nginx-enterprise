upstream backend_cluster {
    # Mục 5.2: Round-Robin (Mặc định) và Least Connections
    # Bỏ comment dòng 'least_conn;' dưới đây để dùng thuật toán Least Connections
    # least_conn; 
    
    # Mục 5.3: Failover & Health Checks
    # max_fails=3: Nếu sập 3 lần sẽ bị loại. fail_timeout=30s: Bị loại trong 30 giây
    server backend1:80 max_fails=3 fail_timeout=30s;
    server backend2:80 max_fails=3 fail_timeout=30s;
    keepalive 32; # Giữ kết nối mở để giảm độ trễ
}
# Mục 3.3: Chuyển HTTP sang HTTPS
server {
    listen 80;
    server_name domain1.local;
    return 301 https://$host$request_uri;
}

# Mục 3.2: Khối chính HTTPS
server {
    listen 443 ssl;
    server_name domain1.local;

    ssl_certificate /etc/nginx/ssl/domain1.crt;
    ssl_certificate_key /etc/nginx/ssl/domain1.key;

    root /usr/share/nginx/html/domain1;
    index index.html;

    # Mục 4.1: Cấu hình Userdir
    location ~ ^/~(.+?)(/.*)?$ {
        alias /usr/share/nginx/html/users/$1/public_html$2;
        index index.html index.php;
        autoindex on;
    }

    # Mục 4.2: Tích hợp PHP-FPM
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Mục 4.3: Cấu hình CGI scripts
    location /cgi-bin/ {
        root /usr/share/nginx/html/domain1;
        fastcgi_pass unix:/var/run/fcgiwrap.socket;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Mục 3.4 - Lớp bảo vệ 1: Basic Auth
    location /secure/ {
        auth_basic "Khu vuc can xac thuc (Restricted Area)";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd;
    }

    # Mục 3.4 - Lớp bảo vệ 2: PAM Auth
    location /pam-secure/ {
        auth_pam "Khu vuc xac thuc bang OS User (PAM)";
        auth_pam_service_name "nginx";
    }
    # Mục 3.4 - Lớp bảo vệ 3: Kerberos Auth
    location /kerberos-secure/ {
        auth_pam "Kerberos Authentication";
        auth_pam_service_name "nginx-krb5";
    }
    # Mục 5.1: Cấu hình Reverse Proxy Gateway
    location /load-balancer/ {
        # Bật Rate Limit (cho phép dồn tối đa 20 request cùng lúc)
        limit_req zone=mylimit burst=20 nodelay;

        # Bật Catching
        proxy_cache my_cache;
        proxy_cache_valid 200 302 10m; # Cache mã 200 trong 10 phút
        proxy_cache_valid 404 1m;      # Cache mã 404 trong 1 phút

        # Bật Keepalive cho Proxy
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_pass http://backend_cluster/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
